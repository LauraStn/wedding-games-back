spring:
  application:
    name: games-backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:wedding_games}
    username: ${DB_USER:wedding_games}
    password: ${DB_PASSWORD:wedding_games}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:}
  security:
    session-cookie:
      name: ${APP_SESSION_COOKIE_NAME:wg_session}
      max-age-seconds: ${APP_SESSION_COOKIE_MAX_AGE_SECONDS:2592000}
      secure: ${APP_SESSION_COOKIE_SECURE:true}
      same-site: ${APP_SESSION_COOKIE_SAME_SITE:Lax}
      domain: ${APP_SESSION_COOKIE_DOMAIN:}
  bootstrap:
    admin:
      username: ${APP_BOOTSTRAP_ADMIN_USERNAME:}
      password: ${APP_BOOTSTRAP_ADMIN_PASSWORD:}
      display-name: ${APP_BOOTSTRAP_ADMIN_DISPLAY_NAME:Administrateur}
    event:
      slug: ${APP_BOOTSTRAP_EVENT_SLUG:}
      title: ${APP_BOOTSTRAP_EVENT_TITLE:Notre mariage}
      language: ${APP_BOOTSTRAP_EVENT_LANGUAGE:fr-FR}
  invitation:
    base-url: ${APP_INVITATION_BASE_URL:http://localhost:5173/invite}
