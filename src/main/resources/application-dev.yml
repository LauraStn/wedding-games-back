spring:
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

app:
  security:
    session-cookie:
      secure: false
      same-site: Lax

logging:
  level:
    com.weddinggames.backend: DEBUG
    org.springframework.security: DEBUG
